name: Bug report
description: Something in figmake-sync broke
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: When it failed
  - type: textarea
    id: error
    attributes:
      label: Error
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      render: markdown
